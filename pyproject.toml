[project]
name = "wallhaven-parser"
version = "0.1.0"
description = "Parser and sender from wallhaven, to telegram and your disk"
readme = "README.md"
authors = [
    { name = "l1ghtdevelop", email = "niirokalostas1234@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles==25.1.0",
    "aiogram==3.30.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiohttp-socks==0.12.0",
    "aiosignal==1.4.0",
    "annotated-types==0.8.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.0",
    "fake-useragent>=2.2.0",
    "frozenlist==1.8.0",
    "httplib2==0.32.0",
    "idna==3.18",
    "lxml==6.1.1",
    "magic-filter==1.0.12",
    "multidict==6.7.1",
    "pillow==12.3.0",
    "pip==24.0",
    "propcache==0.5.2",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pyparsing==3.3.2",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "scheduler==0.8.11",
    "soupsieve==2.9.2",
    "typeguard==4.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.7.0",
    "yarl==1.24.5",
]

[project.scripts]
wallhaven-parser = "wallhaven_parser:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# select = [...]  # See the Default Rules page for the full listing.
ignore = [
    "D100",
    "D101",
    "D102",
    "ANN101", # Не требовать тип для 'self' в методах классов
    "ANN202",
    "CPY001",
    "TC003",
    "ERA001",
]
select = ["ALL"]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[\\p{XID_Continue}]*[\\p{XID_Continue}--_]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
